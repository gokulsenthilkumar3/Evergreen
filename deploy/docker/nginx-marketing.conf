    location ^~ /demo/ {
        try_files $uri $uri/ =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }

    # Public contact projection; resolve the optional provider at request time.
    location = /marketing-api/site-settings {
        limit_except GET { deny all; }
        resolver 127.0.0.11 valid=30s;
        set $contact_upstream http://admin-api:4300;
        proxy_pass $contact_upstream/public/marketing-settings;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Provider-Key "";
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store" always;
    }
    # Public assistant only. Do not proxy private tenant routes from marketing.
    location = /marketing-api/ai/marketing {
        proxy_pass http://tenant-api:4301/ai/marketing;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}
