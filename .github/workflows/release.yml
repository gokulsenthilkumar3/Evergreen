name: Build and publish a release
run-name: 'release:${{ inputs.request_id }}:${{ inputs.version }}'
on:
  workflow_dispatch:
    inputs:
      request_id: { description: 'Provider release job UUID', required: true, type: string }
      version: { description: 'Existing desktop package version, prefixed with v', required: true, type: string }
      title: { description: 'Release title', required: false, type: string }
      notes: { description: 'Release notes', required: false, type: string }
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - id: revision
        name: Check version and request
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('apps/desktop/package.json')); if (!/^[a-f0-9-]{36}$/.test(process.env.REQUEST_ID) || process.env.RELEASE_VERSION !== 'v'+p.version || !/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_VERSION)) process.exit(1)"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run verify
  images:
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: true
      matrix: { target: [tenant-api, tenant-web, admin-api, admin-web, marketing-web] }
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Resolve registry name
        id: registry
        env: { REPOSITORY: '${{ github.repository }}' }
        run: echo "repository=${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ steps.registry.outputs.repository }}/${{ matrix.target }}:${{ needs.validate.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
  windows:
    needs: validate
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ needs.validate.outputs.commit }}', persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - name: Build signed one-click installer and updater metadata
        env:
          EVERGREEN_UPDATE_URL: ${{ vars.EVERGREEN_UPDATE_URL }}
          EVERGREEN_WINDOWS_PUBLISHER: ${{ vars.EVERGREEN_WINDOWS_PUBLISHER }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          if (!$env:EVERGREEN_UPDATE_URL -or !$env:EVERGREEN_WINDOWS_PUBLISHER -or !$env:CSC_LINK) { throw 'Configure the public update feed, publisher and signing certificate in the release environment' }
          npm run release:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
  publish:
    needs: [validate, images, windows]
    runs-on: ubuntu-latest
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows-release, path: artifacts }
      - name: Publish the reviewed artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          RELEASE_TITLE: ${{ inputs.title }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then echo 'Release tag already exists; choose a new version.' >&2; exit 1; fi
          node -e "require('fs').writeFileSync('release-notes.txt', process.env.RELEASE_NOTES || '')"
          (cd artifacts && sha256sum *.exe *.blockmap latest.yml > SHA256SUMS)
          gh release create "$RELEASE_VERSION" artifacts/* --target "$RELEASE_COMMIT" --title "${RELEASE_TITLE:-$RELEASE_VERSION}" --notes-file release-notes.txt
