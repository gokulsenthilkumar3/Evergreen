name: Deploy an installation
run-name: 'deploy:${{ inputs.request_id }}:${{ inputs.target }}:${{ inputs.release }}'
on:
  workflow_dispatch:
    inputs:
      request_id: { description: 'Provider release job UUID', required: true, type: string }
      target: { description: 'Configured installation environment and runner label', required: true, type: string }
      release: { description: 'Published image commit SHA', required: true, type: string }
permissions:
  contents: read
  packages: read
concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  deploy:
    environment: ${{ inputs.target }}
    runs-on: [self-hosted, linux, evergreen-deploy, '${{ inputs.target }}']
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate request and protected host configuration
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release }}
          STATE_DIRECTORY: ${{ vars.EVERGREEN_DEPLOY_STATE }}
        run: |
          node --input-type=module -e "import path from 'node:path'; if (!/^[a-f0-9-]{36}$/.test(process.env.REQUEST_ID) || !/^[a-z][a-z0-9-]{0,50}$/.test(process.env.TARGET) || !/^[a-f0-9]{40}$/.test(process.env.RELEASE_SHA) || !path.isAbsolute(process.env.STATE_DIRECTORY || '') || process.env.STATE_DIRECTORY === '/') process.exit(1)"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install or update with a maintenance window
        env:
          TARGET: ${{ inputs.target }}
          RELEASE_SHA: ${{ inputs.release }}
          STATE_DIRECTORY: ${{ vars.EVERGREEN_DEPLOY_STATE }}
          EVERGREEN_IMAGE_PREFIX: ghcr.io/${{ github.repository }}
        run: node scripts/release/workflow-deploy.mjs
