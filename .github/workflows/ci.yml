name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
      ADMIN_DATABASE_URL: file:./admin-test.db
      JWT_SECRET: ci-only-72dd710bab23369402ce86bd20a8ec597088fc320f4ec45e
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Require a single installed copy of react and react-dom
        run: |
          for pkg in react react-dom; do
            copies=$(npm ls "$pkg" --all --parseable | sort -u)
            if [ "$(echo "$copies" | grep -c .)" -ne 1 ]; then
              echo "::error::Expected exactly one installed copy of $pkg, found:"
              echo "$copies"
              exit 1
            fi
          done
      - name: Verify migrations, types, tests, and production builds
        run: npm run verify
      - name: Lint tenant API
        run: npm run lint:check -w apps/api
      - name: Lint provider API
        run: npm run lint:check -w apps/admin-api
      - name: Lint tenant web
        run: npm run lint -w apps/web
      - name: Lint provider web
        run: npm run lint -w apps/admin-web
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
