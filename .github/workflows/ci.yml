name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Type-check ────────────────────────────────────────────────────
  typecheck:
    name: TypeScript (API + Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check — API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: TypeScript check — Web
        run: npx tsc --noEmit
        working-directory: apps/web

  # ── Unit Tests ───────────────────────────────────────────────────────────
  test-api:
    name: API Unit Tests (Jest)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./test.db
      JWT_SECRET: ci-test-secret-must-be-at-least-32-characters-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Run Jest tests
        run: npm test -- --no-coverage --forceExit
        working-directory: apps/api

  test-web:
    name: Web Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: VITEST=true npx vitest run
        working-directory: apps/web

  # ── Build Check ──────────────────────────────────────────────────────────
  build:
    name: Build (API + Web)
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      DATABASE_URL: file:./test.db
      JWT_SECRET: ci-build-secret-must-be-at-least-32-characters-long
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: packages/database

      - name: Build API
        run: npm run build
        working-directory: apps/api

      - name: Build Web
        run: npm run build
        working-directory: apps/web

  # ── Security Audit ───────────────────────────────────────────────────────
  audit:
    name: npm audit (high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Report but don't fail on audit warnings yet
