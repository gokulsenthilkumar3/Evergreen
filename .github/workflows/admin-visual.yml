name: Admin visual acceptance
on:
  pull_request:
    paths: ['apps/admin-web/**','package-lock.json','.github/workflows/admin-visual.yml']
  workflow_dispatch:
jobs:
  visual:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm'}
      - run: npm ci
      - run: npm exec -w apps/admin-web -- playwright install chromium
      - run: npm exec -w apps/admin-web -- playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: admin-visual-diffs, path: .evergreen/visual-results}
